name: labreserve

x-app: &app
  image: labreserve:local
  build:
    context: .
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labreserve}
      POSTGRES_USER: ${POSTGRES_USER:-labreserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labreserve_demo_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 20s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    <<: *app
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-labreserve}:${POSTGRES_PASSWORD:-labreserve_demo_only}@postgres:5432/${POSTGRES_DB:-labreserve}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  simulator:
    <<: *app
    entrypoint: ["/app/simulator"]
    environment:
      GRPC_ADDR: ":9090"
      SIMULATOR_MODE: ${SIMULATOR_MODE:-normal}
      SIMULATOR_DELAY: ${SIMULATOR_DELAY:-3s}
    healthcheck:
      test: ["CMD", "/app/simulator", "-healthcheck", "-address", "127.0.0.1:9090"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    stop_grace_period: 15s

  controller:
    <<: *app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-labreserve}:${POSTGRES_PASSWORD:-labreserve_demo_only}@postgres:5432/${POSTGRES_DB:-labreserve}?sslmode=disable
      HTTP_ADDR: ":8080"
      GRPC_TARGET: simulator:9090
      DATABASE_TIMEOUT: ${DATABASE_TIMEOUT:-2s}
      DIAGNOSTICS_TIMEOUT: ${DIAGNOSTICS_TIMEOUT:-1s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-5s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      simulator:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/controller", "-healthcheck", "-address", "http://127.0.0.1:8080/readyz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    stop_grace_period: 15s

  swagger:
    image: swaggerapi/swagger-ui:v5.32.14
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      TRY_IT_OUT_ENABLED: "false"
    volumes:
      - ./api/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
