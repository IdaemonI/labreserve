name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: labreserve_test
          POSTGRES_USER: labreserve
          POSTGRES_PASSWORD: ci_demo_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labreserve -d labreserve_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://labreserve:ci_demo_only@127.0.0.1:5432/labreserve_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: make fmt-check
      - name: Static checks
        run: go vet ./...
      - name: Build
        run: make build
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Apply migrations twice
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - name: PostgreSQL integration and race tests
        run: make integration-race
      - name: Validate OpenAPI 3.1
        run: make openapi
      - name: Validate Compose configuration
        run: docker compose --profile docs config --quiet
      - name: Build application image
        run: docker build -t labreserve:local .
      - name: Compose smoke test
        run: |
          docker compose -p labreserve_ci up --no-build -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/readyz; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/readyz
          python3 scripts/demo.py
      - name: Compose logs
        if: always()
        run: docker compose -p labreserve_ci logs --no-color
      - name: Stop CI containers
        if: always()
        run: docker compose -p labreserve_ci down
